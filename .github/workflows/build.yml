name: Gerar HS3Companion.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar HS3Companion.apk
        working-directory: android
        env:
          VERSAO_APP: 0.1.${{ github.run_number }}
          NUMERO_APP: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../HS3Companion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: HS3Companion.apk

  build:
    needs: android
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install pyinstaller certifi pillow

      - name: Gravar versão
        shell: pwsh
        run: Set-Content -Path bridge/versao.txt -Value "0.1.${{ github.run_number }}" -NoNewline

      - name: Gerar executável
        working-directory: bridge
        run: pyinstaller --onefile --noconsole --name HS3Companion --icon icon.ico --add-data "web;web" --add-data "versao.txt;." --add-data "../mod/HS3Discovery;HS3Discovery" --add-data "../ue4ss_kit;ue4ss_kit" --hidden-import tkinter --hidden-import tkinter.filedialog companion.py

      - name: Montar pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pacote | Out-Null
          Copy-Item bridge/dist/HS3Companion.exe pacote/
          Copy-Item -Recurse mod/HS3Discovery pacote/HS3Discovery
          Copy-Item LEIA-ME.txt pacote/
          Compress-Archive -Path pacote/* -DestinationPath HS3Companion.zip -Force

      - name: Pegar o app Android
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: HS3 Companion v0.1.${{ github.run_number }}
          body: |
            Baixe **HS3Companion.zip**, extraia e siga o LEIA-ME.txt.
            Commit: ${{ github.sha }}
          fail_on_unmatched_files: false
          files: |
            HS3Companion.zip
            HS3Companion.apk
