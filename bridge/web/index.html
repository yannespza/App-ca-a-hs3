<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS3 Rancho &amp; Expedições</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/lib/leaflet.css">
<link rel="stylesheet" href="/estilo.css">
<meta name="theme-color" content="#121c19">
</head>
<body>
<div class="app">

  <!-- trilho de navegação -->
  <nav class="trilho" id="abas" aria-label="Seções">
    <div class="marca" title="HS3 Rancho &amp; Expedições">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M20 2v10M20 28v10M2 20h10M28 20h10" stroke="currentColor" stroke-width="2.4"/><circle cx="20" cy="20" r="2.6" fill="currentColor"/></svg>
    </div>
    <button data-aba="mapa" class="ativo"><svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4Zm0 0v13.5m6-11v13.5"/></svg><span>Mapa</span></button>
    <button data-aba="armario"><svg viewBox="0 0 24 24"><path d="M8 7V5a4 4 0 0 1 8 0v2M5 9a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9Zm4 4h6v4H9z"/></svg><span>Mochila</span></button>
    <button data-aba="loja"><svg viewBox="0 0 24 24"><path d="M9 3 4 6l-1 6 3 1v8h12v-8l3-1-1-6-5-3c0 2-1.3 3-3 3S9 5 9 3Z"/></svg><span>Roupas</span></button>
    <button data-aba="enciclopedia"><svg viewBox="0 0 24 24"><path d="M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Zm0 13a3 3 0 0 1 3-3h9M9 8h5"/></svg><span>Diário</span></button>
    <button data-aba="cacadas"><svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg><span>Caçadas</span></button>
    <div class="trilho-rodape">
      <span id="versao" class="versao"></span>
    </div>
  </nav>

  <!-- barra superior -->
  <header class="topo">
    <div class="local">
      <h1 id="nome-reserva">Procurando o jogo…</h1>
      <span class="conexao"><i id="led" class="led"></i><span id="conexao-txt">Procurando o jogo…</span></span>
    </div>
    <div class="numeros">
      <div class="num"><span class="num-rot">Créditos</span><b id="p-saldo">–</b></div>
      <div class="num patente"><span class="num-rot">Patente</span><b id="p-patente">–</b>
        <span class="trilha"><i id="p-patente-barra"></i></span><em id="p-patente-sub" class="num-sub"></em></div>
      <div class="num"><span class="num-rot">Reputação na reserva</span><b id="p-rep">–</b></div>
      <div class="num"><span class="num-rot">Pontos de campo</span><b id="p-campo">–</b></div>
    </div>
    <div class="topo-acoes">
      <button id="btn-atualizar" class="btn sec" onclick="clicarAtualizar()">Procurar atualização</button>
      <button class="btn fantasma" onclick="sair()" title="Fecha o HS3 Companion">Fechar</button>
    </div>
  </header>

  <!-- área principal -->
  <main class="palco">
    <section class="mapa-papel so-mapa">
      <div id="mapa"></div>
      <div class="camadas legenda">
        <label><input type="checkbox" id="f-pois" checked><span>Pontos</span></label>
        <label><input type="checkbox" id="f-estr"><span>Estruturas</span></label>
        <label><input type="checkbox" id="f-nevoa" checked><span>Névoa</span></label>
        <label><input type="checkbox" id="f-animais" checked><span>Animais</span></label>
      </div>
      <div class="mapa-botoes">
        <button class="btn-mapa" onclick="centralizar()" title="Centralizar em mim">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>Eu</button>
        <button class="btn-mapa" id="btn-tirar-pino" onclick="tirarPino()" style="display:none">Tirar pino</button>
        <button class="btn-mapa" id="btn-voltar" onclick="voltarAgora()" style="display:none">Voltar ao último local</button>
        <label class="btn-mapa alterna" title="Ao entrar na reserva, volta para onde você estava quando saiu"><input type="checkbox" id="f-voltar"><span>Voltar ao último local ao entrar</span></label>
      </div>
      <div class="hud-tele" id="telemetria"></div>
      <div class="dica-mapa">Clique no mapa para marcar um pino. Ele aparece também no mapa do jogo.</div>
      <div id="aviso-teleporte" class="aviso-teleporte"></div>
      <div id="mapa-aviso" class="mapa-aviso"></div>

      <div class="painel-papel" id="painel-armario"></div>
      <div class="painel-papel" id="painel-loja"></div>
      <div class="painel-papel" id="painel-enciclopedia"></div>
      <div class="painel-papel" id="painel-cacadas">
        <div class="cacadas">
          <header class="pag-topo"><h2>Suas caçadas</h2><p>Tudo o que o app registrou desde que você começou a usar.</p></header>
          <div class="cac-grade">
            <section class="cac-bloco"><h3>Resumo</h3><div class="tele-linhas" id="diario"></div></section>
            <section class="cac-bloco"><h3>Por espécie</h3><div id="cac-especies" class="barras"></div></section>
            <section class="cac-bloco"><h3>Por arma</h3><div id="cac-armas" class="barras"></div></section>
            <section class="cac-bloco largo"><h3>Últimos abates</h3><div id="ultimos"></div></section>
          </div>
        </div>
      </div>
    </section>

    <!-- lateral: contratos -->
    <aside class="lado">
      <div class="earl npc">
        <img id="npc-foto" src="/img/npc_earl.png" alt="">
        <div>
          <div class="npc-nome" id="npc-nome">–</div>
          <div class="npc-funcao" id="npc-funcao">–</div>
        </div>
      </div>
      <p class="npc-frase" id="npc-frase"></p>

      <div class="segmentos" role="tablist">
        <button class="ativo" data-seg="ofertas">Ofertas <span id="n-ofertas" class="cont"></span></button>
        <button data-seg="ativas">Em andamento <span id="p-contratos" class="cont"></span></button>
        <button data-seg="chat">Conversa</button>
      </div>

      <div class="seg ativo" id="seg-ofertas"><div id="ofertas"></div></div>
      <div class="seg" id="seg-ativas">
        <label class="opcao-hud" title="Mostra os contratos ativos do app na caixa de objetivos do jogo, com o progresso">
          <input type="checkbox" id="f-hud"><span>Mostrar os contratos do app dentro do jogo</span></label>
        <div id="ativas"></div>
      </div>
      <div class="seg chat" id="seg-chat">
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-txt" autocomplete="off" placeholder="Pergunte ao Earl: como chego perto de um cervo?">
          <button class="btn">Enviar</button>
        </form>
        <div class="sub" id="ollama-status"></div>
        <span id="npc-apelido" hidden></span>
      </div>
    </aside>
  </main>
</div>

<script src="/lib/leaflet.js"></script>
<script src="/silhuetas.js"></script>
<script src="/app.js"></script>
</body>
</html>
