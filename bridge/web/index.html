<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS3 Rancho &amp; Expedições</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/lib/leaflet.css">
<link rel="stylesheet" href="/estilo.css">
<meta name="theme-color" content="#2a1a0e">
</head>
<body>
<div class="moldura">
  <i class="rebite r1"></i><i class="rebite r2"></i><i class="rebite r3"></i><i class="rebite r4"></i>

  <header>
    <div class="placa-titulo">HS3 Rancho &amp; Expedições</div>
    <div class="topo-dir">
      <span class="conexao"><i id="led" class="led"></i><span id="conexao-txt">Procurando o jogo…</span></span>
      <span id="versao" class="versao"></span>
      <button id="btn-atualizar" class="btn-couro" onclick="clicarAtualizar()">Procurar atualização</button>
      <button class="btn-couro" onclick="sair()" title="Fecha o HS3 Companion">Fechar</button>
    </div>
  </header>

  <section class="placas">
    <div class="placa"><div class="placa-rot">Saldo</div><div class="placa-val" id="p-saldo">–</div><div class="placa-ico" data-sil="porco"></div></div>
    <div class="placa"><div class="placa-rot">Patente</div><div class="placa-val" id="p-patente">–</div>
      <div class="placa-barra"><i id="p-patente-barra"></i></div><div class="placa-sub" id="p-patente-sub"></div></div>
    <div class="placa"><div class="placa-rot">Reputação</div><div class="placa-val" id="p-rep">–</div><div class="placa-ico" data-sil="cervo"></div></div>
    <div class="placa"><div class="placa-rot">Contratos IA</div><div class="placa-val" id="p-contratos">–</div><div class="placa-ico" data-sil="pato"></div></div>
    <div class="placa"><div class="placa-rot">Pontos de campo</div><div class="placa-val" id="p-campo">–</div><div class="placa-ico" data-sil="cervo"></div></div>
  </section>

  <main class="corpo">
    <section class="mapa-papel so-mapa">
      <i class="tacha t1"></i><i class="tacha t2"></i><i class="tacha t3"></i><i class="tacha t4"></i>
      <nav class="abas-papel" id="abas">
        <button data-aba="mapa" class="ativo">Mapa</button>
        <button data-aba="armario">Mochila</button>
        <button data-aba="loja">Loja de roupas</button>
        <button data-aba="enciclopedia">Diário de campo</button>
      </nav>
      <div id="mapa"></div>
      <div class="painel-papel" id="painel-armario"></div>
      <div class="painel-papel" id="painel-loja"></div>
      <div class="painel-papel" id="painel-enciclopedia"></div>
      <div id="aviso-teleporte" class="aviso-teleporte"></div>
      <div id="mapa-aviso" class="mapa-aviso"></div>
      <div class="legenda">
        <label><input type="checkbox" id="f-pois" checked> Pontos</label>
        <label><input type="checkbox" id="f-estr"> Estruturas</label>
        <label><input type="checkbox" id="f-nevoa" checked> Névoa</label>
        <label><input type="checkbox" id="f-animais" checked> Animais</label>
        <button class="btn-mini" onclick="centralizar()">⌖ Eu</button>
        <button class="btn-mini" id="btn-tirar-pino" onclick="tirarPino()" style="display:none">✕ Pino</button>
        <label title="Ao entrar na reserva, volta para onde você estava quando saiu"><input type="checkbox" id="f-voltar"> Voltar ao último local</label>
        <button class="btn-mini" id="btn-voltar" onclick="voltarAgora()" style="display:none">↩ Voltar agora</button>
      </div>
      <div class="dica-mapa">Clique no mapa para colocar um pino (aparece também no mapa do jogo)</div>
    </section>

    <aside class="lado">
      <div class="cartaz npc">
        <i class="tacha t1"></i><i class="tacha t2"></i>
        <div class="cartaz-titulo">Contratos</div>
        <div class="npc-topo">
          <img id="npc-foto" src="/img/npc_earl.png" alt="">
          <div>
            <div class="npc-nome" id="npc-nome">–</div>
            <div class="npc-funcao" id="npc-funcao">–</div>
            <div class="npc-frase" id="npc-frase"></div>
          </div>
        </div>
        <div id="ofertas"></div>
      </div>

      <div class="cartaz">
        <i class="tacha t1"></i><i class="tacha t2"></i>
        <div class="cartaz-titulo">Contratos ativos</div>
        <div id="ativas"></div>
      </div>

      <div class="cartaz chat">
        <i class="tacha t1"></i><i class="tacha t2"></i>
        <div class="cartaz-titulo">Pergunte ao <span id="npc-apelido">guia</span></div>
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-txt" autocomplete="off" placeholder="Ex.: Como chego perto de um cervo sem ele me perceber?">
          <button class="btn-couro">Enviar</button>
        </form>
        <div class="sub" id="ollama-status"></div>
      </div>
    </aside>
  </main>

  <section class="telemetria">
    <div class="tele-bloco">
      <div class="tele-titulo">Telemetria</div>
      <div class="tele-linhas" id="telemetria"></div>
    </div>
    <div class="tele-bloco">
      <div class="tele-titulo">Diário de caça</div>
      <div class="tele-linhas" id="diario"></div>
    </div>
    <div class="tele-bloco tele-ultimos">
      <div class="tele-titulo">Últimos abates</div>
      <div id="ultimos"></div>
    </div>
  </section>
</div>

<script src="/lib/leaflet.js"></script>
<script src="/silhuetas.js"></script>
<script src="/app.js"></script>
</body>
</html>
